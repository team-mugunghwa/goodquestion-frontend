name: goodquestion
description: "GoodQuestion — 좋은 질문을 나누는 앱. 태블릿/iPad 우선."
publish_to: "none"
version: 0.1.0+1

environment:
  # 팀 전원이 같은 Flutter 3.44.9 (Dart 3.12.2) 를 씁니다. docs/SETUP.md 참고
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 상태관리 — ViewModel(ChangeNotifier) 을 위젯 트리에 붙입니다
  provider: ^6.1.2

  # DI — Repository / UseCase / DataSource 등 위젯과 무관한 객체
  get_it: ^8.0.3

  # 라우팅 — 경로를 lib/core/router/ 한 곳에 선언합니다. 딥링크·경로 파라미터용
  go_router: ^17.4.0

  # HTTP — 인터셉터로 토큰·에러·로깅을 한 곳에서 처리
  dio: ^5.7.0

  # DTO 의 fromJson 자동 생성용 애노테이션
  # json_serializable 6.11+ 는 4.12.0 이상을 요구합니다
  json_annotation: ^4.12.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 코드 생성
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

  # 테스트용 mock (코드 생성 불필요)
  mocktail: ^1.0.4

  # 린트 규칙. analysis_options.yaml 에서 확장합니다
  flutter_lints: ^5.0.0

  # 로고 하나로 Android/iOS 앱 아이콘 전체를 생성
  flutter_launcher_icons: ^0.14.4

# 앱 아이콘 생성 설정.
# 로고를 바꾸면 아래 명령을 다시 돌리세요.
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_mark.png"

  # iOS 아이콘은 투명도를 허용하지 않습니다. 흰 배경으로 채웁니다.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

  # Android 어댑티브 아이콘: 기기 런처가 모양(원/사각/스퀘어클)을 정하므로
  # 전경 이미지는 가장자리가 잘립니다. 그래서 여백을 더 준 별도 파일을 씁니다.
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

    # 화면별 더미 JSON. 서버가 나오면 화면 코드가 아니라 이 폴더가 사라집니다.
    # → docs/DECISIONS.md 015
    - assets/dummy/
