name: goodquestion
description: "GoodQuestion — 좋은 질문을 나누는 앱. 태블릿/iPad 우선."
publish_to: "none"
version: 0.1.0+1

environment:
  # 팀 전원이 같은 Flutter 3.44.9 (Dart 3.12.2) 를 씁니다. docs/SETUP.md 참고
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # 상태관리 — ViewModel(ChangeNotifier) 을 위젯 트리에 붙입니다
  provider: ^6.1.2

  # DI — Repository / UseCase / DataSource 등 위젯과 무관한 객체
  get_it: ^8.0.3

  # 라우팅 — 경로를 lib/core/router/ 한 곳에 선언합니다. 딥링크·경로 파라미터용
  go_router: ^17.4.0

  # HTTP — 인터셉터로 토큰·에러·로깅을 한 곳에서 처리
  dio: ^5.7.0

  # 인증 토큰은 OS 보안 저장소에, OAuth 인가 코드는 시스템 브라우저로 처리
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^4.1.0

  # 구글·카카오 브랜드 로고 SVG
  flutter_svg: ^2.2.0

  # DTO 의 fromJson 자동 생성용 애노테이션
  # json_serializable 6.11+ 는 4.12.0 이상을 요구합니다
  json_annotation: ^4.12.0

  # 푸시 알림. 고객센터 답변이 등록되면 서버가 FCM 으로 보냅니다.
  # 설정값(env/*.json 의 FIREBASE_*)이 없으면 초기화 자체를 건너뛰므로
  # 로컬과 CI 에서는 Firebase 없이도 그대로 뜹니다. → lib/core/push/
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

  cupertino_icons: ^1.0.8
  record: 7.1.1
  audioplayers: ^6.8.1

  # 기기 내장 음성으로 글자를 읽어 줍니다. 서버 TTS 가 붙기 전까지의 임시입니다
  # (docs/DECISIONS.md 019). 목소리가 없는 기기에서는 버튼이 비활성됩니다
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 코드 생성
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

  # 테스트용 mock (코드 생성 불필요)
  mocktail: ^1.0.4

  # 린트 규칙. analysis_options.yaml 에서 확장합니다
  flutter_lints: ^5.0.0

  # 로고 하나로 Android/iOS 앱 아이콘 전체를 생성
  flutter_launcher_icons: ^0.14.4

# 앱 아이콘 생성 설정.
# 로고를 바꾸면 아래 명령을 다시 돌리세요.
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_mark.png"

  # iOS 아이콘은 투명도를 허용하지 않습니다. 흰 배경으로 채웁니다.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

  # Android 어댑티브 아이콘: 기기 런처가 모양(원/사각/스퀘어클)을 정하므로
  # 전경 이미지는 가장자리가 잘립니다. 그래서 여백을 더 준 별도 파일을 씁니다.
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # 플러터는 assets/images/ 하위 폴더를 재귀 포함하지 않으므로 명시합니다.
    # 이야기 표지 원본(세로 2:3). 파일이 없으면 코드 표지로 폴백합니다.
    - assets/images/covers/
    - assets/images/dialogue/
    # 대화 장면 캐릭터 상태 에셋(WebP). 매니페스트는 banggui/states.json.
    # 원본 PNG 39MB -> WebP 3.4MB. 원본은 저장소에 넣지 않는다.
    - assets/images/dialogue/banggui/
    - assets/images/dialogue/banggui/scene_03/
    - assets/images/dialogue/banggui/scene_05/
    - assets/images/dialogue/banggui/scene_07/
    - assets/images/dialogue/banggui/scene_09/
    - assets/images/missions/
    # 말하기 후 활동(순서 맞추기)의 장면 카드. 글씨 없는 그림만 씁니다.
    # 원본 PNG 11MB(1920x1080) -> WebP 400KB(960x540). 원본은 저장소에 넣지 않는다.
    - assets/images/recap/banggui/
    - assets/icons/

    # STT 로 못 알아들었을 때 쓰는 캐릭터 목소리(mp3 40개, 1.1MB).
    # 재시도 안내 · 선택지 안내 · 선택지 문장. manifest.json 이 문장 원본이고,
    # 코드가 읽는 것은 그걸 옮겨 둔 Dart 상수 테이블입니다(런타임 파싱 안 함).
    # → docs/이야기_전개_가이드.md 3.4
    - assets/audio/choices/

    # 화면별 더미 JSON. 서버가 나오면 화면 코드가 아니라 이 폴더가 사라집니다.
    # → docs/DECISIONS.md 015
    - assets/dummy/
    - assets/policies/
