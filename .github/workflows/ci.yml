name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # iOS 빌드를 수동으로 돌리고 싶을 때 (Actions 탭 → Run workflow)
  workflow_dispatch:
  # 주 1회 iOS 빌드 검증 (월요일 오전 9시 KST = 일요일 00:00 UTC)
  schedule:
    - cron: "0 0 * * 0"

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소해 러너 시간을 아낌
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  analyze:
    name: 포맷 · 정적 분석 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 패키지 설치
        run: flutter pub get

      - name: 포맷 검사
        run: dart format --set-exit-if-changed .

      - name: 정적 분석
        # analysis_options.yaml 의 규칙 위반이 있으면 실패
        run: flutter analyze --fatal-infos

      - name: 테스트
        run: flutter test --coverage

      - name: 커버리지 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Android 빌드
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: APK 빌드 (debug)
        run: flutter build apk --debug

  # ⚠️ macOS 러너는 무료 사용량을 10배로 차감합니다.
  # 실측: 2분 30초짜리 빌드가 30분으로 계산됨 (조직 무료 한도 월 2,000분)
  #
  # 그래서 평소에는 돌리지 않고, 아래 두 경우에만 실행합니다.
  #   1. 수동 실행 (Actions 탭 → CI → Run workflow)
  #   2. 매주 일요일 자동 검증
  #
  # 평상시 iOS 검증은 Mac 쓰는 팀원의 로컬 빌드에 의존합니다.
  build-ios:
    name: iOS 빌드
    runs-on: macos-latest
    needs: analyze
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: iOS 빌드 (서명 없음)
        run: flutter build ios --debug --no-codesign
